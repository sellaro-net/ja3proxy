name: SDK owner-approved npm staging

# No push/tag/PR trigger, no GHCR coupling, and no automatic first publication.
# Bootstrap requires the owner's real licensed package, never a placeholder.
# Configure npm trusted publishing for this filename and npm-staging environment,
# with only npm stage publish allowed. Final approval stays with the owner + 2FA.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-npm-staging
  cancel-in-progress: false

jobs:
  quality:
    if: github.repository == 'sellaro-net/ja3proxy' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/sdk-quality.yml
    permissions:
      contents: read

  prepare:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: npm-staging
    permissions:
      contents: read
      actions: read
    outputs:
      sha256: ${{ steps.artifact.outputs.sha256 }}
    env:
      SDK_NPM_BOOTSTRAPPED: ${{ vars.SDK_NPM_BOOTSTRAPPED }}
      SDK_RELEASE_APPROVED_LICENSE: ${{ vars.SDK_RELEASE_APPROVED_LICENSE }}
      SDK_RELEASE_APPROVED_VERSION: ${{ vars.SDK_RELEASE_APPROVED_VERSION }}
      SDK_RELEASE_APPROVED_SHA: ${{ vars.SDK_RELEASE_APPROVED_SHA }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Enforce owner license and protected environment approvals
        run: node packages/typescript/scripts/release-approval.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install exact release tooling without lifecycle scripts
        run: npm install --global npm@12.0.2 pnpm@11.15.1 --ignore-scripts --no-audit --no-fund
      - name: Install locked development dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build reviewed source and prepare an approved isolated package copy
        run: |
          pnpm sdk:typecheck
          pnpm sdk:build
          pnpm --filter @sellaro/ja3proxy release:pack
      - name: Build the actual Rust service for the exact release artifact
        run: docker build --tag ja3proxy-sdk-release-check .
      - name: Validate the exact approved tarball against real Rust
        shell: bash
        run: |
          set -euo pipefail
          container="ja3proxy-sdk-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() { docker logs "$container" || true; docker rm -f "$container" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          export JA3_PROXY_TOKEN
          JA3_PROXY_TOKEN=$(openssl rand -hex 32)
          docker run --detach --name "$container" --network host \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --env JA3_PROXY_TOKEN --env PORT=18992 --env ALLOW_PRIVATE_IPS=true ja3proxy-sdk-release-check
          export JA3_PROXY_URL=http://127.0.0.1:18992
          export JA3_SMOKE_ORIGIN_HOST=127.0.0.1
          curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-connrefused --max-time 2 "$JA3_PROXY_URL/health"
          pnpm --filter @sellaro/ja3proxy check:consumers --release --interop
      - name: Bind staging to the validated bytes
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          sha256=$(cut -d ' ' -f1 packages/typescript/artifacts/*.tgz.sha256)
          printf 'sha256=%s\n' "$sha256" >> "$GITHUB_OUTPUT"
      - name: Upload only the validated tarball and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: approved-sdk-${{ github.sha }}
          path: |
            packages/typescript/artifacts/*.tgz
            packages/typescript/artifacts/*.tgz.sha256
          if-no-files-found: error
          retention-days: 7

  stage:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-staging
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      SDK_NPM_BOOTSTRAPPED: ${{ vars.SDK_NPM_BOOTSTRAPPED }}
      SDK_RELEASE_APPROVED_LICENSE: ${{ vars.SDK_RELEASE_APPROVED_LICENSE }}
      SDK_RELEASE_APPROVED_VERSION: ${{ vars.SDK_RELEASE_APPROVED_VERSION }}
      SDK_RELEASE_APPROVED_SHA: ${{ vars.SDK_RELEASE_APPROVED_SHA }}
      SDK_ARTIFACT_SHA256: ${{ needs.prepare.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Recheck approvals without registry credentials
        run: node packages/typescript/scripts/release-approval.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Install the exact reviewed npm CLI
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: approved-sdk-${{ github.sha }}
          path: packages/typescript/artifacts
      - name: Stage validated bytes with ephemeral OIDC for owner review
        run: node packages/typescript/scripts/stage-release.mjs
