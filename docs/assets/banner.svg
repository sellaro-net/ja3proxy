<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title description">
  <title id="title">ja3proxy — browser-shaped TLS, explicit control</title>
  <desc id="description">A dark navy project banner with a mint wordmark and a fingerprint flowing into three isolated network routes.</desc>
