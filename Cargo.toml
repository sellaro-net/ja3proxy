[package]
name = "ja3proxy"
version = "1.0.0"
edition = "2024"
rust-version = "1.98.1"
description = "TLS-Impersonate HTTP Proxy Service with JA3/JA4 fingerprinting"
authors = ["Lukas"]
repository = "https://github.com/sellaro-net/ja3proxy"
readme = "README.md"

[dependencies]
# Runtime
tokio = { version = "1.53.1", features = ["full"] }

# HTTP client and browser emulation use upstream's renumbered stable release pair.
wreq = { version = "0.16.1", features = ["json", "socks", "gzip", "brotli", "zstd", "deflate", "stream"] }
wreq-util = { version = "0.2.0", features = ["emulation-serde", "emulation-compression"] }
futures-util = "0.3.34"

# Web Framework
axum = { version = "0.8.9", features = ["json"] }
tower = { version = "0.5.3", features = ["limit", "timeout"] }
tower-http = { version = "0.7.1", features = ["trace", "limit", "timeout"] }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

# Base64 for binary responses
base64 = "0.23.1"

# URL parsing for SSRF protection
url = "2.5.8"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Error handling
anyhow = "1.0.104"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
