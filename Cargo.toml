[package]
name = "ja3proxy"
version = "2.0.0"
edition = "2024"
rust-version = "1.98.1"
description = "TLS-Impersonate HTTP Proxy Service with JA3/JA4 fingerprinting"
authors = ["Lukas"]
repository = "https://github.com/sellaro-net/ja3proxy"
readme = "README.md"

[features]
# Schema generation is opt-in; production builds do not link Schemars.
schema-export = ["dep:schemars"]

[dependencies]
# Runtime
tokio = { version = "1.53.1", features = ["full"] }

# HTTP client and browser emulation. wreq resolves to the fork pinned in [patch.crates-io]
# (see docs/dependencies.md). Mozilla roots (webpki-roots) stay the verification store.
wreq = { version = "0.16.1", default-features = false, features = ["webpki-roots", "tokio-rt", "json", "socks", "gzip", "brotli", "zstd", "deflate", "stream"] }
wreq-util = { version = "0.2.0", features = ["emulation-serde", "emulation-compression"] }
# Inspect the existing TLS backend's typed errors instead of matching error text.
btls = { version = "0.5.6", default-features = false }
futures-util = "0.3.34"
bytes = "1"
async-stream = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }
subtle = "2"
cookie_store = { version = "0.22", default-features = false }
cookie = "0.18"
psl = "2"
time = "0.3"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
percent-encoding = "2.3.2"

# Web Framework
axum = { version = "0.8.9", features = ["json"] }

# Serialization
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
schemars = { version = "=1.2.2", optional = true }

# URL parsing for SSRF protection
url = "2.5.8"

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Error handling
anyhow = "1.0.104"

[dev-dependencies]
tokio-btls = "0.5.6"
rcgen = "0.14"
flate2 = "1"
# Rohe HTTP/2-Frames des Clients in Loopback-Golden-Tests dekodieren.
http2 = { version = "0.5.20", features = ["unstable"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[patch.crates-io]
# wreq fork: upstream main plus the transport patches listed in docs/dependencies.md.
wreq = { git = "https://github.com/sellaro-net/wreq", rev = "36b819b247cdcda201973c67e1912c6ed8aa7751" }
# http2 unverändert von Upstream, per Commit: http2::ext::HeadersPriority (Priorität pro
# Anfrage) steht in keinem crates.io-Release (zuletzt 0.5.20). Kein Fork, siehe docs/dependencies.md.
http2 = { git = "https://github.com/0x676e67/http2", rev = "bdb2c60cd9b4125c28913191b6f758d00e5f136c" }
# BoringSSL mit ML-DSA im TLS-Signaturalgorithmen-Katalog (mldsa44/65/87),
# Signaturalgorithmen-GREASE, Trust-Anchor-IDs und der server_padding-Extension
# (0x12e0), die aktuelles Chrome (>= 154) ankündigt. Revision 1e98087 ist der
# Upstream-Commit "feat(ssl): expose server padding extension APIs (#212)"; das
# Release 0.5.6 kennt ML-DSA nur als Primitive und keine dieser TLS-APIs.
btls = { git = "https://github.com/0x676e67/btls", rev = "1e980877343872b671d18a185395e31c10cc51d5" }
btls-sys = { git = "https://github.com/0x676e67/btls", rev = "1e980877343872b671d18a185395e31c10cc51d5" }
tokio-btls = { git = "https://github.com/0x676e67/btls", rev = "1e980877343872b671d18a185395e31c10cc51d5" }
